<div class="container mx-auto py-12 px-6">
  <div *ngIf="blog; else notFound" class="max-w-3xl mx-auto bg-white shadow-lg rounded-lg p-8">
    
    <a routerLink="/blogs" class="text-blue-500 hover:underline mb-6 inline-block">
      ← Back to Blogs
    </a>

    <h2 class="text-4xl font-semibold text-gray-800 mb-4">{{ blog.title }}</h2>

    
    <p class="text-sm text-gray-500 mb-6">{{ blog.createdDate | date: 'longDate' }}</p>

    
    <p class="text-lg text-gray-700 leading-relaxed mb-6">{{ blog.content }}</p>

    <div class="mb-6">
      <label for="visibility" class="block text-gray-700 text-lg font-medium mb-2">Visibility</label>
      <select
        id="visibility"
        class="w-full p-3 bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [(ngModel)]="blog.public">
        <option [ngValue]="true">Public</option>
        <option [ngValue]="false">Private</option>
      </select>
    </div>

    <a
      routerLink="/blog/edit/{{ blog.id }}"
      class="text-white bg-red-500 hover:bg-red-600 px-6 py-2 rounded-full font-semibold transition duration-200 ease-in-out"
      >Edit Blog</a
    >
    <button
  (click)="saveBlog()"
  class="text-white bg-blue-500 hover:bg-blue-600 px-6 py-2 rounded-full font-semibold transition duration-200 ease-in-out cus cursor-pointer "
>
  Save
</button>

  </div>

  <ng-template #notFound>
    <p class="text-center text-2xl text-red-500 mt-12">Blog post not found.</p>
  </ng-template>
</div>
