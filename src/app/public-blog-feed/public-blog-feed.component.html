<div class="max-w-3xl mx-auto mt-10 space-y-6">
    <div *ngFor="let blog of blogs" class="bg-white shadow-md rounded-lg p-6">
      
      <!-- User Info & Date -->
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-3">
          <img [src]="blog.userAvatar" alt="Avatar" class="w-10 h-10 rounded-full" />
          <div>
            <h4 class="font-semibold">{{ blog.userName }}</h4>
            <p class="text-sm text-gray-500">{{ blog.createdDate | date: 'medium' }}</p>
          </div>
        </div>
      </div>
  
      <h2 class="text-xl font-bold mb-2">{{ blog.title }}</h2>

      <p class="text-gray-700 mb-4" [ngClass]="{ 'line-clamp-3': !blog.expanded }">
        {{ blog.content }}
      </p>
      
      <button 
        class="text-blue-500 hover:underline font-medium cursor-pointer"
        (click)="blog.expanded = !blog.expanded"
      >
        {{ blog.expanded ? 'Show less' : 'Read more' }}
      </button>

      <app-comment [blogId]="blog.id" 
      >
      </app-comment>
    </div>
  </div>
