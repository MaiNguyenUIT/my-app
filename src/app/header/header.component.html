<nav class="bg-gray-800 text-white p-4">
  <div class="container mx-auto flex justify-between items-center">
    <a routerLink="/" class="text-2xl font-bold">My Blog</a>

    <div>
      <a routerLink="/" class="px-4 hover:text-gray-300">Home</a>
      <a routerLink="/blogs" class="px-4 hover:text-gray-300">Blogs</a>

      <a *ngIf="!isLoggedIn" routerLink="/login" class="px-4 hover:text-gray-300">Login</a>
      <a *ngIf="isLoggedIn" routerLink="/user" class="px-4 hover:text-gray-300">{{ userName }}</a>
      <a *ngIf="isAdmin && isLoggedIn" routerLink="/users" class="px-4 hover:text-gray-300">Users</a>
      <button *ngIf="isLoggedIn" routerLink="/home" class="px-4 hover:text-gray-300" (click)="logout()">Logout</button>
      <div class="relative inline-block mx-2" *ngIf="isLoggedIn">
        <button (click)="toggleNotifications()" class="relative focus:outline-none cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white hover:text-gray-300" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C8.67 6.165 8 7.388 8 8.75v5.408c0 .538-.214 1.055-.595 1.436L6 17h5m4 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span *ngIf="notifications.length > 0"
            class="absolute top-0 right-0 inline-block w-4 h-4 text-xs text-center text-white bg-red-600 rounded-full">
            {{ notifications.length }}
          </span>
        </button>
      
        <div *ngIf="showNotifications"
          class="absolute right-0 mt-2 w-64 bg-white text-black rounded-md shadow-lg z-50 max-h-80 overflow-y-auto">
          <div *ngIf="notifications.length === 0" class="p-4 text-sm text-gray-500">No notifications</div>
          <div *ngFor="let noti of notifications" class="p-3 hover:bg-gray-100 border-b text-sm">
            {{ noti.content }}
          </div>
        </div>
      </div>
    </div>
    
    
  </div>
</nav>
