<div class="max-w-2xl mx-auto p-6 bg-white rounded-xl shadow-md mt-8">
    <h2 class="text-2xl font-bold mb-6 text-center">Update Blog Post</h2>
    <form (ngSubmit)="onSubmit()" #blogForm="ngForm">
      <div class="mb-4">
        <label for="title" class="block font-semibold mb-1">Title</label>
        <input
          type="text"
          id="title"
          name="title"
          [(ngModel)]="blog.title"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-md"
        />
      </div>
  
      <div class="mb-4">
        <label for="content" class="block font-semibold mb-1">Content</label>
        <textarea
          id="content"
          name="content"
          [(ngModel)]="blog.content"
          required
          rows="6"
          class="w-full px-4 py-2 border border-gray-300 rounded-md"
        ></textarea>
      </div>
      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md"
      >
        Post Blog
      </button>
    </form>
  </div>
