<div class="max-w-4xl mx-auto mt-10">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">User Management</h2>
  
    <div *ngIf="isLoading" class="text-center py-8">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-gray-900 mx-auto"></div>
      <span class="text-gray-600 mt-2 block">Loading users...</span>
    </div>
  
    <div *ngIf="!isLoading && users.length === 0" class="text-center py-8 text-gray-500">
      No users found.
    </div>
  
    <div *ngIf="!isLoading" class="grid gap-6">
      <div *ngFor="let user of users" 
           class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 hover:shadow-md transition-shadow duration-200">
        <div class="flex items-center justify-between">
          <div class="flex-1">
            <h3 class="text-lg font-semibold text-gray-900">{{ user.username }}</h3>
            <p class="text-gray-600 mt-1">{{ user.email }}</p>
            <span class="inline-block mt-2 px-2 py-1 text-sm rounded-full 
                        {{ user.userRole === 'ADMIN' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-800' }}">
              {{ user.userRole }}
            </span>
          </div>
          <div class="flex space-x-2">
            <button routerLink="/user/edit/{{ user.id }}"
                    class="p-2 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-colors duration-150"
                    title="Edit user">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
              </svg>
            </button>
            <button (click)="deleteUser(user)" 
                    class="p-2 text-gray-600 hover:text-red-600 hover:bg-red-50 rounded-full transition-colors duration-150"
                    title="Delete user">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5-4h4"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
