<div class="max-w-md mx-auto mt-10 bg-white shadow-md rounded-xl p-6">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">User Information</h2>

    <div *ngIf="user; else loading">
      <img *ngIf="user.avatarUrl" [src]="user.avatarUrl" alt="Avatar" class="w-24 h-24 rounded-full object-cover border" />
      <p><strong>Username:</strong> {{ user.username }}</p>
      <p><strong>Email:</strong> {{ user.email }}</p>
      <p><strong>Roles:</strong> {{ user.userRole }}</p>
      <div class="max-w-md mx-auto mt-6 p-4 bg-white rounded-xl shadow-md">
        <h2 class="text-lg font-semibold mb-4 text-gray-700">Upload Image</h2>
      
        <div class="flex flex-col items-center gap-3">
          <!-- Preview ảnh -->
          <img *ngIf="previewUrl" [src]="previewUrl" alt="Preview" class="w-32 h-32 object-cover rounded-full shadow">
      
          <!-- Chọn file -->
          <label class="cursor-pointer inline-block px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition">
            Choose File
            <input type="file" class="hidden" (change)="onFileSelected($event)" />
          </label>
      
          <!-- Upload button -->
          <button 
            (click)="uploadImage()" 
            class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition"
            [disabled]="!selectedFile"
          >
            Upload
          </button>
        </div>
      </div>
      
    </div>
  
    <ng-template #loading>
      <p>Loading user info...</p>
    </ng-template>
  </div>
