<div class="container mx-auto py-12">
  <div class="flex justify-start gap-4 mt-4">
    <button
      (click)="save('true')"
      class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-300 cursor-pointer"
    >
      Public
    </button>
    <button
      (click)="save('false')"
      class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-300 cursor-pointer"
    >
      Private
    </button>
    <button
    (click)="setAllPublic()"
      class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-300 cursor-pointer"
    >
    {{ selectAll ? 'De select all' : 'Select all' }}
    </button>
  </div>
    <h2 class="text-3xl font-bold text-center mb-8">Blog Posts</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let blog of blogs" class="bg-white shadow-lg rounded-lg overflow-hidden relative">
        <div class="p-6">
          <h3 class="text-xl font-semibold mb-2">{{ blog.blog.title }}</h3>
          <p class="text-gray-600 mb-4">{{ blog.blog.createdDate }}</p>
          <a routerLink="/blog/{{ blog.blog.id }}" class="text-blue-500 hover:underline">Read More</a>
          <select class="absolute top-2 right-2" [(ngModel)]="blog.blog.public" (change)="onSubmit(blog)">
            <option [ngValue]="true">Public</option>
            <option [ngValue]="false">Private</option>
          </select>

          <label class="absolute top-2 left-2 flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" [(ngModel)]="blog.checkBox" class>
          </label>
          

          <button (click)="deleteBlog(blog)" 
                    class="absolute bottom-2 right-2 p-2 text-gray-600 hover:text-red-600 hover:bg-red-50 rounded-full transition-colors duration-150 cursor-pointer"
                    title="Delete Blog">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5-4h4"/>
              </svg>
            </button>

        </div>
      </div>
    </div>
  </div>
