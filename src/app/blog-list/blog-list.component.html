<div class="container mx-auto py-12">
    <h2 class="text-3xl font-bold text-center mb-8">Blog Posts</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let blog of blogs" class="bg-white shadow-lg rounded-lg overflow-hidden relative">
        <div class="p-6">
          <h3 class="text-xl font-semibold mb-2">{{ blog.title }}</h3>
          <p class="text-gray-600 mb-4">{{ blog.createdDate }}</p>
          <a routerLink="/blog/{{ blog.id }}" class="text-blue-500 hover:underline">Read More</a>
          <input class="absolute top-2 right-2" [(ngModel)]="blog.public" type="checkbox"/>
        </div>
      </div>
    </div>
  </div>
  <div class="flex justify-center gap-4 mt-4">
    <button
      (click)="setPublic(true)"
      class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-300 cursor-pointer"
    >
      Public
    </button>
  
    <button
      (click)="setPublic(false)"
      class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-300 cursor-pointer"
    >
      Private
    </button>

    <button
      (click)="setAllPublic()"
      class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-300 cursor-pointer"
    >
      Select All
    </button>
  </div>
