<div class="container mx-auto py-12">
    <h2 class="text-3xl font-bold text-center mb-8">Blog Posts</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let blog of blogs" class="bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="p-6">
          <h3 class="text-xl font-semibold mb-2">{{ blog.title }}</h3>
          <p class="text-gray-600 mb-4">{{ blog.date }}</p>
          <a routerLink="/blog/{{ blog.id }}" class="text-blue-500 hover:underline">Read More</a>
        </div>
      </div>
    </div>
  </div>
