<!-- Display existing comments -->
<div class="mt-4 space-y-2">
    <div *ngFor="let comment of comments" class="bg-gray-100 rounded px-3 py-2 text-sm">
      <strong>{{ comment.userName }}</strong>: {{ comment.content }}
    </div>
  </div>
  
  <!-- New comment input -->
  <form (ngSubmit)="postComment()" class="flex items-center space-x-2 mt-4">
    <input
      type="text"
      [(ngModel)]="newComment"
      name="commentInput"
      placeholder="Write a comment..."
      class="flex-1 border rounded-full px-4 py-2 text-sm focus:outline-none focus:ring"
    />
    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-full text-sm hover:bg-blue-600">
      Post
    </button>
  </form>
